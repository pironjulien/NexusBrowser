<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title data-i18n="pairTitle">NexusBrowser</title>
    <link rel="stylesheet" href="popup.css">
    <style>
        body { width: auto; max-width: 34rem; margin: 3rem auto; padding: 0 1rem; }
        form { display: flex; gap: .5rem; margin-top: 1rem; }
        input { flex: 1; font: inherit; padding: .4rem .6rem; }
    </style>
</head>
<body>
    <header class="top">
        <img class="logo" src="icons/logo96.png" alt="">
        <span class="brand">NexusBrowser</span>
    </header>
    <main>
        <h1 id="state" class="state" data-i18n="pairHeading"></h1>
        <p id="detail" class="detail" data-i18n="pairIntro"></p>
        <form id="form">
            <input id="code" autocomplete="off" spellcheck="false" data-i18n-aria-label="pairCodeLabel" maxlength="43">
            <button type="submit" data-i18n="pairButton"></button>
        </form>
    </main>
    <script src="i18n.js"></script>
    <script src="bridge_link.js"></script>
    <script src="pair.js"></script>
</body>
</html>
