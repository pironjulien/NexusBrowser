name: Install

# The public install on a clean Windows (a fresh GitHub runner), from the release package built here: the one-line
# installer run as a file under Windows PowerShell 5.1 (no Python, no .NET on the path it uses), then every AI client found has its
# entry, the shared daemon answers with the user token, and a real MCP round trip goes through the bridge and the
# extension. Branded Chrome no longer loads an extension from the command line (Chrome 137+), so the run uses Chrome for
# Testing with --load-extension, the one step a user does by hand in chrome://extensions.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json
      - name: Release package (win-x64), as the release workflow builds it
        shell: pwsh
        run: |
          ./scripts/package-release.ps1 -Runtime win-x64 -OutDir dist
          Get-ChildItem dist -File | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content dist/SHA256SUMS.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: package
          path: dist/

  clean-windows:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: package
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: AI clients a user may have (Claude Code and Codex CLIs, Antigravity and Claude Desktop folders)
        shell: pwsh
        run: |
          npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.310 @openai/codex@0.164.0
          New-Item -ItemType Directory -Force "$HOME\.gemini\antigravity", "$env:APPDATA\Claude", "$HOME\.codex" | Out-Null
      - name: Chrome for Testing with the extension (the user's "Load unpacked")
        shell: pwsh
        run: |
          $out = npx --yes @puppeteer/browsers@3.2.6 install chrome@stable --path "$env:RUNNER_TEMP\cft" --format "{{path}}"
          $chrome = ($out | Select-Object -Last 1).Trim()
          # Chrome for Testing reads its native hosts under its own key: the manifest install.ps1 writes is declared there.
          $manifest = Join-Path $HOME '.nexus\nexus-browser\native-host\com.nexus.browser_auth.json'
          reg add "HKCU\Software\Google\Chrome for Testing\NativeMessagingHosts\com.nexus.browser_auth" /ve /t REG_SZ /d $manifest /f
          reg add "HKCU\Software\Chromium\NativeMessagingHosts\com.nexus.browser_auth" /ve /t REG_SZ /d $manifest /f
          Start-Process $chrome -ArgumentList "--user-data-dir=$env:RUNNER_TEMP\profile", '--no-first-run', '--no-default-browser-check',
            "--load-extension=$env:GITHUB_WORKSPACE\extension", 'about:blank'
      - name: Installer run as a file (Windows PowerShell 5.1, as a user runs it)
        shell: powershell
        run: |
          $env:NEXUS_BROWSER_SOURCE = (Resolve-Path dist\NexusBrowser-win-x64.zip).Path
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\get.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Entries, daemon and a real round trip (MCP stdio, bridge, extension, page)
        shell: pwsh
        run: |
          ./tests/install-smoke.ps1
          if (-not $?) { Get-Content (Join-Path $HOME '.nexus\nexus-browser\bridge.log') -Tail 40 -ErrorAction SilentlyContinue; exit 1 }
      - name: Guide shown when the extension is not loaded yet (no wait)
        shell: powershell
        run: |
          & "$env:LOCALAPPDATA\NexusBrowser\app\scripts\guide-extension.ps1" -WaitSeconds 0
          if (-not $?) { exit 1 }
      - name: Self-update contract (task and state of the bridge)
        shell: pwsh
        run: |
          $task = Get-ScheduledTask -TaskName 'Nexus Browser Update' -ErrorAction SilentlyContinue
          if (-not $task -or $task.Actions.Execute -ne 'conhost.exe' -or $task.Actions.Arguments -notmatch 'self-update\.ps1') { throw 'update task missing or not native' }
          $token = (Get-Content (Join-Path $HOME '.nexus\nexus-browser\bridge-token') -Raw).Trim()
          $state = Invoke-RestMethod -Uri 'http://127.0.0.1:9225/api/update' -Headers @{ 'X-Nexus-Browser-Token' = $token }
          Write-Host ($state | ConvertTo-Json -Compress)
          if ($state.product -ne 'browser' -or -not $state.version) { throw 'no update state' }
      - name: Running the installer again changes nothing (update path)
        shell: powershell
        run: |
          $env:NEXUS_BROWSER_SOURCE = (Resolve-Path dist\NexusBrowser-win-x64.zip).Path
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\get.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & pwsh -NoProfile -File .\tests\install-smoke.ps1 -EntriesOnly
          if ($LASTEXITCODE) { exit 1 }
      - name: A tampered package or a failed update keeps the working version
        shell: pwsh
        run: |
          $root = Join-Path $env:LOCALAPPDATA 'NexusBrowser'
          $app = Join-Path $root 'app'
          function Assert-Working([string]$Case) {
            $left = @(Get-ChildItem $root -Directory | Where-Object Name -notin 'app', 'versions' | ForEach-Object Name)
            if ($left) { throw "$Case : folders left behind: $left" }
            if ((Get-Content (Join-Path $app 'install.ps1') -Raw) -match 'Injected failure') { throw "$Case : broken version installed" }
            $health = Invoke-RestMethod 'http://127.0.0.1:16182/health' -TimeoutSec 5
            Write-Host "$Case : working version kept, daemon $($health.version) running"
          }
          # 1. A package whose hash is not the one listed: refused before anything changes.
          $bad = Join-Path $env:RUNNER_TEMP 'tampered'
          New-Item -ItemType Directory $bad | Out-Null
          Copy-Item dist\* $bad
          [IO.File]::AppendAllText((Join-Path $bad 'NexusBrowser-win-x64.zip'), 'x')
          $env:NEXUS_BROWSER_SOURCE = Join-Path $bad 'NexusBrowser-win-x64.zip'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\get.ps1
          if ($LASTEXITCODE -eq 0) { throw 'tampered package: the update should have been refused' }
          Assert-Working 'tampered package'
          # 2. The installer fails: the previous folder comes back and is installed again.
          $broken = Join-Path $env:RUNNER_TEMP 'broken-install'
          Copy-Item $app $broken -Recurse
          $install = Join-Path $broken 'install.ps1'
          (Get-Content $install -Raw).Replace('exit $LASTEXITCODE', @'
          $current = Join-Path $env:LOCALAPPDATA 'NexusBrowser\current.json'
          $state = Get-Content $current -Raw | ConvertFrom-Json
          $state.version = 'broken-update-fixture'
          $state | ConvertTo-Json | Set-Content $current
          throw 'Injected failure (CI)'
          '@) | Set-Content $install -NoNewline
          # A previous installer with unsafe legacy behavior must NEVER execute during recovery.
          $legacyTrap = Join-Path $env:RUNNER_TEMP 'old-installer-was-run'
          "[IO.File]::WriteAllText('$legacyTrap', 'unsafe old installer ran'); throw 'Legacy installer trap'" | Set-Content (Join-Path $app 'install.ps1')
          $env:NEXUS_BROWSER_SOURCE = $broken
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\get.ps1
          if ($LASTEXITCODE -eq 0) { throw 'failing installer: the update should have failed' }
          if (Test-Path $legacyTrap) { throw 'rollback executed the previous installer' }
          $restored = Get-Content (Join-Path $root 'current.json') -Raw | ConvertFrom-Json
          if ($restored.version -eq 'broken-update-fixture') { throw 'rollback did not restore the configuration' }
          & pwsh -NoProfile -File .\tests\install-smoke.ps1 -EntriesOnly
          if ($LASTEXITCODE) { throw 'restored client entries or daemon do not match the previous payload' }
          Assert-Working 'failing installer'
          exit 0  # the step's result is the assertions above, not the expected failure code of the last get.ps1

  pack:
    # The Nexus pack (get-nexus.ps1) runs get.ps1 with NEXUS_PACK=1 on a clean Windows: no question, no wait, no window,
    # exit code 0, a NEXUS_PACK_RESULT line, Antigravity as a plugin; the guide is the pack's own last step.
    needs: package
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: package
          path: dist
      - name: Antigravity and Codex folders a user may have
        shell: pwsh
        run: New-Item -ItemType Directory -Force "$HOME\.gemini\antigravity", "$HOME\.codex" | Out-Null
      - name: get.ps1 under NEXUS_PACK=1, as the pack runs it
        shell: pwsh
        env:
          NEXUS_PACK: '1'
        run: |
          $env:NEXUS_BROWSER_SOURCE = (Resolve-Path dist\NexusBrowser-win-x64.zip).Path
          $before = @(Get-Process chrome -ErrorAction SilentlyContinue).Count
          $watch = [Diagnostics.Stopwatch]::StartNew()
          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\get.ps1 2>&1 | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          $out | Write-Host
          if ($code -ne 0) { throw "get.ps1 exit code $code" }
          $line = $out | Where-Object { $_ -like 'NEXUS_PACK_RESULT *' } | Select-Object -Last 1
          if ($line -notmatch 'Antigravity=plugin' -or $line -notmatch 'Codex=declared') { throw "unexpected summary: $line" }
          if (($out | Where-Object { $_.Trim() } | Select-Object -Last 1) -ne $line) { throw 'NEXUS_PACK_RESULT is not the last line' }
          if (@(Get-Process chrome -ErrorAction SilentlyContinue).Count -gt $before) { throw 'Chrome was opened' }
          $plugin = Join-Path $HOME '.gemini\antigravity\plugins\nexus-browser'
          foreach ($f in 'plugin.json', 'mcp_config.json', 'skills\nexus-browser\SKILL.md') {
            if (-not (Test-Path (Join-Path $plugin $f))) { throw "missing $f" }
          }
          Write-Host "Pack install OK in $([int]$watch.Elapsed.TotalSeconds) s: $line"
      - name: The pack's final step, the guide, does not wait
        shell: powershell
        run: |
          & "$env:LOCALAPPDATA\NexusBrowser\app\scripts\guide-extension.ps1" -WaitSeconds 0
          if (-not $?) { exit 1 }
