name: Install

# The public install on a clean Windows (a fresh GitHub runner): the one-line installer under Windows PowerShell 5.1,
# then every AI client found has its entry, and a real MCP round trip goes through the bridge and the extension.
# Branded Chrome no longer loads an extension from the command line (Chrome 137+), so the run uses Chrome for Testing
# with --load-extension, the one step a user does by hand in chrome://extensions.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - name: AI clients a user may have (Claude Code and Codex CLIs, Antigravity and Claude Desktop folders)
        shell: pwsh
        run: |
          npm install --global --no-fund --no-audit @anthropic-ai/claude-code@2.1.310 @openai/codex@0.164.0
          New-Item -ItemType Directory -Force "$HOME\.gemini\antigravity", "$env:APPDATA\Claude", "$HOME\.codex" | Out-Null
      - name: Chrome for Testing with the extension (the user's "Load unpacked")
        shell: pwsh
        run: |
          $out = npx --yes @puppeteer/browsers@3.2.6 install chrome@stable --path "$env:RUNNER_TEMP\cft" --format "{{path}}"
          $chrome = ($out | Select-Object -Last 1).Trim()
          # Chrome for Testing reads its native hosts under its own key: the manifest install.ps1 writes is declared there.
          $manifest = Join-Path $HOME '.nexus\nexus-browser\native-host\com.nexus.browser_auth.json'
          reg add "HKCU\Software\Google\Chrome for Testing\NativeMessagingHosts\com.nexus.browser_auth" /ve /t REG_SZ /d $manifest /f
          reg add "HKCU\Software\Chromium\NativeMessagingHosts\com.nexus.browser_auth" /ve /t REG_SZ /d $manifest /f
          Start-Process $chrome -ArgumentList "--user-data-dir=$env:RUNNER_TEMP\profile", '--no-first-run', '--no-default-browser-check',
            "--load-extension=$env:GITHUB_WORKSPACE\extension", 'about:blank'
      - name: One-line installer (Windows PowerShell 5.1, as typed by a user)
        shell: powershell
        env:
          NEXUS_BROWSER_SOURCE: ${{ github.workspace }}
        run: Get-Content -Raw .\get.ps1 | Invoke-Expression
      - name: Entries and a real round trip (MCP stdio, bridge, extension, page)
        shell: pwsh
        run: |
          $python = Join-Path $HOME '.nexus\nexus-browser\venv\Scripts\python.exe'
          & $python -B tests\install_smoke.py (Join-Path $env:LOCALAPPDATA 'NexusBrowser\app')
          if ($LASTEXITCODE) { Get-Content (Join-Path $HOME '.nexus\nexus-browser\bridge.log') -Tail 40 -ErrorAction SilentlyContinue; exit 1 }
      - name: Guide shown when the extension is not loaded yet (no wait)
        shell: powershell
        run: |
          & "$env:LOCALAPPDATA\NexusBrowser\app\scripts\guide-extension.ps1" -WaitSeconds 0
          if (-not $?) { exit 1 }
      - name: Running the installer again changes nothing (update path)
        shell: powershell
        env:
          NEXUS_BROWSER_SOURCE: ${{ github.workspace }}
        run: Get-Content -Raw .\get.ps1 | Invoke-Expression

  pack:
    # The Nexus pack (get-nexus.ps1) runs get.ps1 with NEXUS_PACK=1 on a clean Windows: no question, no wait, no window,
    # exit code 0, a NEXUS_PACK_RESULT line, Antigravity as a plugin; the guide is the pack's own last step.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Antigravity and Codex folders a user may have
        shell: pwsh
        run: New-Item -ItemType Directory -Force "$HOME\.gemini\antigravity", "$HOME\.codex" | Out-Null
      - name: get.ps1 under NEXUS_PACK=1, as the pack runs it
        shell: pwsh
        env:
          NEXUS_PACK: '1'
          NEXUS_BROWSER_SOURCE: ${{ github.workspace }}
        run: |
          $before = @(Get-Process chrome -ErrorAction SilentlyContinue).Count
          $watch = [Diagnostics.Stopwatch]::StartNew()
          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\get.ps1 2>&1 | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          $out | Write-Host
          if ($code -ne 0) { throw "get.ps1 exit code $code" }
          $line = $out | Where-Object { $_ -like 'NEXUS_PACK_RESULT *' } | Select-Object -Last 1
          if ($line -notmatch 'Antigravity=plugin' -or $line -notmatch 'Codex=declared') { throw "unexpected summary: $line" }
          if (@(Get-Process chrome -ErrorAction SilentlyContinue).Count -gt $before) { throw 'Chrome was opened' }
          $plugin = Join-Path $HOME '.gemini\antigravity\plugins\nexus-browser'
          foreach ($f in 'plugin.json', 'mcp_config.json', 'skills\nexus-browser\SKILL.md') {
            if (-not (Test-Path (Join-Path $plugin $f))) { throw "missing $f" }
          }
          Write-Host "Pack install OK in $([int]$watch.Elapsed.TotalSeconds) s: $line"
      - name: The pack's final step, the guide, does not wait
        shell: powershell
        run: |
          & "$env:LOCALAPPDATA\NexusBrowser\app\scripts\guide-extension.ps1" -WaitSeconds 0
          if (-not $?) { exit 1 }
