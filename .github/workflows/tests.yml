name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push makes the running check pointless: cancel it (Windows minutes count double on private repositories).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - name: Test environment (what install.ps1 creates, without the bridge task or Chrome registration)
        shell: pwsh
        run: |
          . ./scripts/runtime.ps1
          uv sync --frozen --quiet
      - name: test.ps1 (ruff, pyright, Python tests, extension tests; offline)
        shell: pwsh
        run: ./test.ps1

  startup-linux:
    # What MCP directories (Glama) check in a Linux container: the server starts and lists its tools.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - name: initialize + tools/list over stdio
        run: |
          uv sync --frozen --quiet
          uv run --frozen pytest -q --noconftest tests/test_startup.py
