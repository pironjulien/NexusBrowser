name: Publish to the MCP registry

# After a release reaches PyPI, publish server.json to the official MCP registry. GitHub OIDC login (namespace
# io.github.pironjulien): no token stored, no manual login. mcp-publisher is pinned by version and SHA-256.
on:
  workflow_run:
    workflows: [Publish to PyPI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'release')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      PUBLISHER_VERSION: v1.8.1
      PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Wait until PyPI serves the version in server.json
        shell: bash
        run: |
          version=$(python3 -c "import json; print(json.load(open('server.json'))['version'])")
          for i in $(seq 1 30); do
            curl -fsS "https://pypi.org/pypi/nexus-browser/$version/json" >/dev/null && exit 0
            sleep 20
          done
          echo "nexus-browser $version is not on PyPI"; exit 1
      - name: Install mcp-publisher (pinned, checksum verified)
        shell: bash
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --strict -c
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish server.json
