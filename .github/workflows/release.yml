# Release: on a vX.Y.Z tag, runs test.ps1, builds the self-contained engine for both Windows architectures
# (NexusBrowser-win-x64.zip, NexusBrowser-win-arm64.zip: what get.ps1 installs), the Chrome Web Store package of the
# extension, the Claude Desktop extension for each architecture (nexus-browser-win-x64.mcpb, nexus-browser-win-arm64.mcpb,
# server type binary) and get.ps1, lists their SHA-256 in
# SHA256SUMS.txt, attests their build provenance (Sigstore, no key to manage: verify with
# `gh attestation verify <file> --repo pironjulien/NexusBrowser`, or offline with the attached NexusBrowser-X.Y.Z.intoto.jsonl
# and `--bundle`), and publishes them as the "NexusBrowser X.Y.Z" GitHub release, notes from CHANGELOG.md. Then
# server.json goes to the official MCP registry (mcpb package: the attached .mcpb, its SHA-256), GitHub OIDC, no token.
# Actions pinned by commit SHA; Dependabot (github-actions) keeps them up to date.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      mcpb-sha256: ${{ steps.packages.outputs.mcpb-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json
      - name: Version matches the tag
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:TAG -ne "v$version") { throw "Tag $env:TAG does not match VERSION $version." }
          foreach ($file in 'mcpb/manifest.json', 'plugin/plugin.json', 'plugin/.claude-plugin/plugin.json', 'plugin/.codex-plugin/plugin.json', 'gemini-extension.json', 'server.json') {
            if ((Get-Content $file -Raw | ConvertFrom-Json).version -ne $version) { throw "$file is not at $version." }
          }
      - name: Tests (test.ps1)
        shell: pwsh
        run: ./test.ps1
      - name: Packages
        id: packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          ./scripts/package-release.ps1 -Runtime win-x64 -OutDir dist -Mcpb
          ./scripts/package-release.ps1 -Runtime win-arm64 -OutDir dist -Mcpb
          $store = ./scripts/store-package.ps1 -OutDir dist
          Copy-Item get.ps1 dist  # the installer too, for running it from a file (checked and attested like the packages)
          # The x64 package really installs and its engine answers (sandbox folder: nothing registered on the runner).
          $env:NEXUS_BROWSER_SOURCE = (Resolve-Path dist/NexusBrowser-win-x64.zip).Path
          $env:NEXUS_BROWSER_ROOT = Join-Path $env:RUNNER_TEMP 'sandbox'
          ./get.ps1
          Remove-Item Env:NEXUS_BROWSER_SOURCE, Env:NEXUS_BROWSER_ROOT
          Get-ChildItem dist -File | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content dist/SHA256SUMS.txt -Encoding utf8NoBOM
          Get-Content dist/SHA256SUMS.txt
          "mcpb-sha256=$((Get-FileHash dist/nexus-browser-win-x64.mcpb -Algorithm SHA256).Hash.ToLower())" >> $env:GITHUB_OUTPUT
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        id: provenance
        with:
          subject-path: dist/*
      - name: Provenance bundle
        shell: pwsh
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          TAG: ${{ github.ref_name }}
        run: Copy-Item $env:BUNDLE "dist/NexusBrowser-$($env:TAG.TrimStart('v')).intoto.jsonl"
      - name: GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $start = [Array]::FindIndex($lines, [Predicate[string]] { param($l) $l -like "## ``[$version``]*" })
          if ($start -lt 0) { throw "CHANGELOG.md has no [$version] section." }
          $end = [Array]::FindIndex($lines, $start + 1, [Predicate[string]] { param($l) $l -like '## *' })
          if ($end -lt 0) { $end = $lines.Count }
          $lines[($start + 1)..($end - 1)] | Set-Content notes.md -Encoding utf8NoBOM
          gh release create $env:TAG (Get-ChildItem dist -File).FullName --title "NexusBrowser $version" --notes-file notes.md --verify-tag --repo $env:GITHUB_REPOSITORY

  registry:
    # server.json to the official MCP registry (namespace io.github.pironjulien), the mcpb package being the x64 .mcpb just
    # attached (identifier: its release URL, fileSha256: its hash). mcp-publisher pinned by version and SHA-256.
    needs: release
    if: github.repository == 'pironjulien/NexusBrowser'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      PUBLISHER_VERSION: v1.8.1
      PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: server.json for this release
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ needs.release.outputs.mcpb-sha256 }}
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/nexus-browser-win-x64.mcpb"
          jq --arg url "$url" --arg sha "$SHA" '.packages[0].identifier = $url | .packages[0].fileSha256 = $sha' server.json > server.release.json
          cat server.release.json
      - name: Install mcp-publisher (pinned, checksum verified)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --strict -c
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish server.release.json
