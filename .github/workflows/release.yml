# Release, in two channels, with the shared Nexus release workflows of NexusSystem.
# - Development: every push to main checks one version everywhere, runs test.ps1 and builds the self-contained engine
#   for both Windows architectures (NexusBrowser-win-x64.zip, NexusBrowser-win-arm64.zip: what get.ps1 installs), the
#   Chrome Web Store package of the extension (nexus-browser-extension-<extension version>.zip), the Claude Desktop
#   extension for each architecture (nexus-browser-win-x64.mcpb, nexus-browser-win-arm64.mcpb, server type binary),
#   get.ps1 and SHA256SUMS.txt. product-dev-release attests them (Sigstore: `gh attestation verify <file> --repo
#   pironjulien/NexusBrowser`, or offline with the attached NexusBrowser-X.Y.Z.intoto.jsonl and `--bundle`) and
#   publishes the pre-release vX.Y.Z-dev.N (NexusSystem's development channel, through NEXUS_RELEASE_TAG).
# - Stable: right after that build when its version is not released yet, or "Run workflow" (promote: a vX.Y.Z-dev.N,
#   or empty for the newest), product-promote runs: the SAME files
#   become the release "NexusBrowser X.Y.Z" with the CHANGELOG section, then server.json goes to the official MCP
#   registry (mcpb package: the attached nexus-browser-win-x64.mcpb, its SHA-256), GitHub OIDC, no token.
#   registry: only re-send a stable release's server.json. get.ps1 installs from releases/latest.
# The Chrome Web Store is not sent from here: scripts/publish-store.ps1 sends a stable release's extension on request.
# Actions and shared workflows pinned by commit SHA; Dependabot (github-actions) keeps them up to date.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      promote:
        description: Development build to publish as stable (vX.Y.Z-dev.N; empty = the newest)
        required: false
        default: ''
      registry:
        description: Only send this stable release's server.json (vX.Y.Z) to the MCP registry again
        required: false
        default: ''

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json
      - name: One version everywhere
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "VERSION: no X.Y.Z version ($version)." }
          $server = Get-Content server.json -Raw | ConvertFrom-Json
          $found = [ordered]@{
            'native/BridgeSecurity.cs' = [regex]::Match((Get-Content native/BridgeSecurity.cs -Raw), 'Version = "([^"]+)"').Groups[1].Value
            'server.json' = $server.version
            'server.json packages[0]' = $server.packages[0].version
          }
          foreach ($file in 'mcpb/manifest.json', 'plugin/plugin.json', 'plugin/.claude-plugin/plugin.json', 'plugin/.codex-plugin/plugin.json', 'gemini-extension.json') {
            $found[$file] = (Get-Content $file -Raw | ConvertFrom-Json).version
          }
          # extension/manifest.json has its own version: the extension is released only when it changes.
          $wrong = @($found.GetEnumerator() | Where-Object { $_.Value -ne $version } | ForEach-Object { "$($_.Key)=$($_.Value)" })
          if ($wrong) { throw "Version $version expected: $($wrong -join ', ')" }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Tests (test.ps1)
        shell: pwsh
        run: ./test.ps1
      - name: Packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          ./scripts/package-release.ps1 -Runtime win-x64 -OutDir dist -Mcpb
          ./scripts/package-release.ps1 -Runtime win-arm64 -OutDir dist -Mcpb
          $store = ./scripts/store-package.ps1 -OutDir dist
          Copy-Item get.ps1 dist  # the installer too, for running it from a file (checked and attested like the packages)
          # The x64 package really installs and its engine answers (sandbox folder: nothing registered on the runner).
          $env:NEXUS_BROWSER_SOURCE = (Resolve-Path dist/NexusBrowser-win-x64.zip).Path
          $env:NEXUS_BROWSER_ROOT = Join-Path $env:RUNNER_TEMP 'sandbox'
          ./get.ps1
          Remove-Item Env:NEXUS_BROWSER_SOURCE, Env:NEXUS_BROWSER_ROOT
          Get-ChildItem dist -File | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content dist/SHA256SUMS.txt -Encoding utf8NoBOM
          Get-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 3

  dev:
    needs: build
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: pironjulien/NexusSystem/.github/workflows/product-dev-release.yml@9cf03f2ac93e207307351b393130ff1cfe2aef7b  # v1.6.40
    with:
      product: NexusBrowser
      version: ${{ needs.build.outputs.version }}

  promote:
    # Right after the push that built a new version (same files), or by hand ("Run workflow").
    needs: dev
    if: always() && (needs.dev.result == 'success' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
      id-token: write
    uses: pironjulien/NexusSystem/.github/workflows/product-promote.yml@9cf03f2ac93e207307351b393130ff1cfe2aef7b  # v1.6.40
    with:
      product: NexusBrowser
      promote: ${{ inputs.promote || needs.dev.outputs.tag }}
      registry-only: ${{ inputs.registry }}
      mcp-package: nexus-browser-win-x64.mcpb

