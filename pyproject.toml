[project]
name = "nexus-browser"
version = "2.24.1"
description = "Your real Chrome, driven by Claude, Codex and Antigravity in background tabs: the nexus-browser MCP server (needs the NexusBrowser bridge and extension)"
authors = [{ name = "Julien Piron" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["mcp", "mcp-server", "chrome", "browser-use", "computer-use", "cdp", "ai-agents", "claude", "codex", "antigravity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "mcp>=2.3.0,<3",
    "pillow>=13,<14",
    "websockets>=13.0,<17",
]

[project.urls]
Homepage = "https://julienpiron.fr/nexusbrowser/"
Repository = "https://github.com/pironjulien/NexusBrowser"
Changelog = "https://github.com/pironjulien/NexusBrowser/blob/main/CHANGELOG.md"
Issues = "https://github.com/pironjulien/NexusBrowser/issues"

[project.scripts]
nexus-browser = "nexus_browser.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# The wheel mirrors the repository layout under nexus_browser/ (client/ imports native-host/ and reads pyproject.toml
# and VERSION by relative path), so the code ships unchanged. `uv sync` still does not install the project
# ([tool.uv] package = false): install.ps1 and the three agents keep running from the checkout.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"packaging/nexus_browser/__init__.py" = "nexus_browser/__init__.py"
"packaging/nexus_browser/__main__.py" = "nexus_browser/__main__.py"
"client" = "nexus_browser/client"
"native-host" = "nexus_browser/native-host"
"VERSION" = "nexus_browser/VERSION"
"pyproject.toml" = "nexus_browser/pyproject.toml"

[tool.hatch.build.targets.sdist]
include = ["client/", "native-host/", "packaging/", "VERSION", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest>=8.0,<10",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false
link-mode = "copy"

[tool.ruff]
# Cache hors OneDrive, même quand ruff est lancé sans scripts\runtime.ps1 (éditeur, agent).
cache-dir = "~/.nexus/nexus-browser/cache/ruff"
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
# Aucun .pytest_cache dans le dépôt (OneDrive), même lancé sans test.ps1.
addopts = "-p no:cacheprovider"

[tool.pyright]
include = ["client", "native-host", "tests"]
pythonVersion = "3.11"
# Modules chargés par chemin (sys.path) : le client et l'hôte natif.
extraPaths = ["client", "native-host", "."]
