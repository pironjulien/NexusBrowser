[project]
name = "nexus-browser"
version = "2.9.0"
description = "Pont Chrome commun à Antigravity, Claude et Codex : extension, pont local authentifié et serveur MCP nexus-browser"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3.0,<3",
    "websockets>=13.0,<17",
]

[dependency-groups]
dev = [
    "pyright==1.1.407",
    "pytest>=8.0,<10",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false
link-mode = "copy"

[tool.ruff]
# Cache hors OneDrive, même quand ruff est lancé sans scripts\runtime.ps1 (éditeur, agent).
cache-dir = "~/.nexus/nexus-browser/cache/ruff"
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
# Aucun .pytest_cache dans le dépôt (OneDrive), même lancé sans test.ps1.
addopts = "-p no:cacheprovider"

[tool.pyright]
include = ["client", "native-host", "tests"]
pythonVersion = "3.10"
# Modules chargés par chemin (sys.path) : le client et l'hôte natif.
extraPaths = ["client", "native-host", "."]
